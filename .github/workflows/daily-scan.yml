# Daily NIFTY 500 scan after the NSE close; merges the signal journal into main via a PR.
# GitHub cron is UTC and delays runs by hours under load, worst on the hour, so
# the schedule avoids :00. 11:17 UTC = 16:47 IST; the 14:47 UTC (20:17 IST)
# backup re-runs only if the journal on main still lacks the latest session.
# Journal rows are keyed by the price bar's session date, so a late run still
# lands on the right day, and a re-run replaces that day's rows.
name: Daily scan

on:
  schedule:
    - cron: "17 11 * * 1-5"
    - cron: "47 14 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill_dates:
        description: "Sessions to rewrite notes for, even if they have some (YYYY-MM-DD, comma-separated)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write  # to dispatch the Tests workflow on the PR branch

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  # Scheduled runs skip when main already has the latest session or an earlier
  # run's journal PR is still open (a second PR on the same rows would conflict).
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      expected: ${{ steps.check.outputs.expected }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: journal

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Latest completed session: today after 15:45 IST, else the previous
          # day, rolled back over weekends. Holidays aren't known, so on one the
          # backup run simply scans again.
          d=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          [ "$(TZ=Asia/Kolkata date +%H%M)" -lt 1545 ] && d=$(date -d "$d -1 day" +%Y-%m-%d)
          while [ "$(date -d "$d" +%u)" -gt 5 ]; do d=$(date -d "$d -1 day" +%Y-%m-%d); done
          echo "expected=$d" >> "$GITHUB_OUTPUT"
          latest=$(ls journal/days | sort | tail -1 | cut -d. -f1)
          open=$(gh pr list --state open --search "head:daily-scan/" --json number -q length)
          run=true
          if [ "${{ github.event_name }}" = schedule ]; then
            if [ "$latest" \> "$d" ] || [ "$latest" = "$d" ]; then
              echo "Journal already has session $latest; skipping"; run=false
            elif [ "$open" -gt 0 ]; then
              echo "A daily-scan PR is still open; skipping"; run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  scan:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache FinBERT model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-prosusai-finbert

      # Fundamentals have a 7-day TTL; carry them between runs so ~500 Yahoo
      # .info calls happen about once a week, not daily. A new key each run
      # saves the refreshed files; restore-keys picks up the latest one.
      - name: Cache fundamentals
        uses: actions/cache@v4
        with:
          path: .cache/fundamentals
          key: fundamentals-${{ github.run_id }}
          restore-keys: fundamentals-

      - name: Install
        run: uv sync --locked

      # LLM notes on the top BUYs (journal/notes/). Ollama runs on CPU here,
      # ~13s per note (50 notes ~11 min); the binary and model (~2.5GB) are cached between runs.
      # If Ollama fails to start, the scan logs a warning and skips notes.
      - name: Cache Ollama
        uses: actions/cache@v4
        with:
          path: |
            ~/ollama
            ~/.ollama/models
          key: ollama-v0.40.15-qwen2.5-3b

      - name: Start Ollama
        continue-on-error: true
        run: |
          if [ ! -x ~/ollama/bin/ollama ]; then
            mkdir -p ~/ollama
            curl -fsSL https://github.com/ollama/ollama/releases/download/v0.40.15/ollama-linux-amd64.tar.zst | tar --zstd -x -C ~/ollama
            # GPU libraries are useless on CPU runners; drop them to keep the cache small
            find ~/ollama/lib -maxdepth 2 -type d -name 'cuda*' -exec rm -rf {} +
          fi
          echo "$HOME/ollama/bin" >> "$GITHUB_PATH"
          nohup ~/ollama/bin/ollama serve > ollama.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:11434 >/dev/null && break; sleep 1; done
          ~/ollama/bin/ollama pull qwen2.5:3b

      - name: Scan
        env:
          NO_COLOR: "1"
          COLUMNS: "120"
        run: |
          uv run aistock scan --watchlist nifty500 --top 50 --notes --notes-max 25 | tee scan.txt
          { echo '```'; cat scan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Notes for journaled sessions that have none (from before notes were
      # saved, or a day Ollama failed). A backfilled note takes ~30s on CI, so
      # two sessions of 25 BUYs per run; the step limit keeps a slow run from
      # starving the journal merge below. Normally this is a no-op.
      - name: Backfill notes
        continue-on-error: true
        timeout-minutes: 30
        env:
          NO_COLOR: "1"
          COLUMNS: "120"
        run: uv run aistock backfill-notes --sessions 2 --notes-max 25

      # Manual runs can rewrite notes for chosen sessions, e.g. after the
      # backfill learns new reasons. Each date replaces that session's notes.
      - name: Rewrite notes for chosen sessions
        if: inputs.backfill_dates != ''
        continue-on-error: true
        timeout-minutes: 45
        env:
          NO_COLOR: "1"
          COLUMNS: "120"
          DATES: ${{ inputs.backfill_dates }}
        run: |
          for d in $(echo "$DATES" | tr ',' ' '); do
            if ! [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [ ! -f "journal/days/$d.csv" ]; then
              echo "::warning::Skipping '$d': not a journaled session (YYYY-MM-DD)"
              continue
            fi
            uv run aistock backfill-notes --date "$d" --notes-max 25
          done

      # Yahoo can lag after the close; flag a scan whose latest bar is older
      # than the expected session (also fires on market holidays).
      - name: Check data freshness
        env:
          EXPECTED: ${{ needs.gate.outputs.expected }}
        run: |
          session=$(ls journal/days | sort | tail -1 | cut -d. -f1)
          if [ "$session" \< "$EXPECTED" ]; then
            echo "::warning::Scan is as of $session but the latest session should be $EXPECTED (stale Yahoo data or a market holiday)"
          fi

      - name: Paper trading report
        env:
          NO_COLOR: "1"
          COLUMNS: "140"
        run: |
          uv run aistock paper --show 20 | tee paper.txt
          { echo '## Paper trading'; echo '```'; cat paper.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Saved accounts (shared capital, 10 slots each) in journal/paper/, which
      # the journal PR below commits; each run catches up on missed sessions.
      - name: Paper accounts
        env:
          NO_COLOR: "1"
          COLUMNS: "140"
        run: |
          uv run aistock paper-account --show | tee accounts.txt
          { echo '## Paper accounts'; echo '```'; cat accounts.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # main is protected (PR + passing "pytest" check), so the journal update
      # goes through a PR. PRs opened with GITHUB_TOKEN don't trigger other
      # workflows, so Tests is dispatched on the branch explicitly, and
      # auto-merge squash-merges the PR once the check passes.
      - name: Merge journal via PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal
          if git diff --cached --quiet; then
            echo "Journal unchanged"
            exit 0
          fi
          day=$(ls journal/days | sort | tail -1 | cut -d. -f1)  # session date
          branch="daily-scan/${day}-${{ github.run_id }}"
          git switch -c "$branch"
          git commit -m "Daily scan ${day}"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "Daily scan ${day}" \
            --body "Automated journal update from [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          gh workflow run tests.yml --ref "$branch"
          gh pr merge "$branch" --auto --squash --delete-branch
