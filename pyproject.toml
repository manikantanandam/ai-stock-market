[project]
name = "aistock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nanirocks125", email = "nanirocks125@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pandas-ta>=0.4.71b0",
    "pyarrow>=26.0.1",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "transformers>=5.23.0",
    "typer>=0.29.2",
    "yfinance>=1.8.0",
]

[project.scripts]
aistock = "aistock.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

# CI runs on Linux: use CPU-only torch there (the default wheel pulls ~3GB of CUDA libs).
# macOS keeps the regular PyPI wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
